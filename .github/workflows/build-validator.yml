name: Build application images

on:
  push:
    branches:
      - 'deploy-build-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: validator
            context: validator
          - kind: submitter
            context: miner
    env:
      IMAGE: ghcr.io/backend-developers-ltd/factory-horde-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine environment from branch
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" != deploy-build-* ]]; then
            echo "Unsupported branch: $BRANCH" >&2
            exit 1
          fi
          echo "ENVIRONMENT=${BRANCH#deploy-build-}" >> "$GITHUB_ENV"

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}-${{ env.ENVIRONMENT }}:v0-latest
            ${{ env.IMAGE }}-${{ env.ENVIRONMENT }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=application-${{ matrix.kind }}
          cache-to: type=gha,mode=max,scope=application-${{ matrix.kind }}

      - name: Smoke check and record immutable reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          REFERENCE="$IMAGE-$ENVIRONMENT@$DIGEST"
          docker pull --platform linux/amd64 "$REFERENCE"
          if [[ "$KIND" == validator ]]; then
            docker run --rm --network none "$REFERENCE" /opt/venv/bin/python -c \
              'import validator.main; from nexus.v1 import NexusTask, SetWeightsBeatNode, WeightSetterNode'
          else
            docker run --rm --network none "$REFERENCE" --help
          fi
          jq -n --arg image "$REFERENCE" --arg commit "$GITHUB_SHA" \
            --arg kind "$KIND" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{kind: $kind, image: $image, commit: $commit, platform: "linux/amd64", run: $run}' \
            > "$KIND-image.json"
          printf '%s\n' "Published: \`$REFERENCE\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-${{ matrix.kind }}
          path: ${{ matrix.kind }}-image.json
          if-no-files-found: error
