name: Build localnet executor fixture

on:
  push:
    branches: ['deploy-build-*']
    paths:
      - '.github/workflows/build-executor-fixture.yml'
      - 'localnet/fixtures/executor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile:
          - lifecycle
          - factory-valid
          - factory-missing
          - factory-nonzero
          - factory-hang
          - factory-symlink
          - judge-valid
          - judge-malformed
          - judge-mismatch
          - judge-missing
          - judge-nan
          - judge-infinite
          - judge-range
          - judge-hang
          - judge-nonzero
          - judge-symlink
    env:
      IMAGE: ghcr.io/backend-developers-ltd/factory-horde-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: localnet/fixtures/executor
          platforms: linux/amd64
          push: true
          build-args: FIXTURE_PROFILE=${{ matrix.profile }}
          tags: ${{ env.IMAGE }}:${{ matrix.profile }}-sha-${{ github.sha }}
          cache-from: type=gha,scope=fixture-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=fixture-${{ matrix.profile }}
      - name: Record immutable reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          KIND: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg image "$IMAGE@$DIGEST" --arg commit "$GITHUB_SHA" \
            --arg kind "$KIND" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{kind: $kind, image: $image, commit: $commit, platform: "linux/amd64", run: $run}' \
            > "$KIND-image.json"
          printf '%s\n' "Published: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Anonymous pull verification is a separate required check.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-${{ matrix.profile }}
          path: ${{ matrix.profile }}-image.json
          if-no-files-found: error
