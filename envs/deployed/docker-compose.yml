# Common application services. Localnet overlays only the chain, identities and isolated paths.
services:
  pylon:
    # bittensor-pylon:2.3.4
    image: docker.io/backenddevelopersltd/bittensor-pylon@sha256:2e7a3470b1ff6f4a72f53a075c1f215cd352a0d289387bad10f328825f396dbb
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PYLON_HOST_PORT:-8000}:8000"
    environment:
      PYLON_BITTENSOR_NETWORK: "${BITTENSOR_NETWORK:?}"
      PYLON_BITTENSOR_ARCHIVE_NETWORK: "${BITTENSOR_NETWORK:?}"
      PYLON_OPEN_ACCESS_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      PYLON_IDENTITIES: '["validator"]'
      PYLON_BITTENSOR_WALLET_PATH: /wallets
      PYLON_DATABASE_PATH: /data/pylon.db
      PYLON_ID_VALIDATOR_WALLET_NAME: "${BITTENSOR_WALLET_NAME:-validator}"
      PYLON_ID_VALIDATOR_HOTKEY_NAME: "${BITTENSOR_WALLET_HOTKEY_NAME:-default}"
      PYLON_ID_VALIDATOR_NETUID: "${NETUID:?}"
      PYLON_ID_VALIDATOR_TOKEN: "${VALIDATOR_PYLON_IDENTITY_TOKEN:?}"
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
      PYLON_BLOCK_DURATION_SECONDS: "${BLOCK_DURATION_SECONDS:-12}"
      PYLON_ENVIRONMENT: "${ENVIRONMENT:?}"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - "${HOST_WALLET_DIR:?}:/wallets:ro"
      - pylon-data:/data
    healthcheck:
      test:
        - CMD
        - /app/pylon_service/.venv/bin/python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  validator:
    # Immutable prototype candidate; source builds may explicitly override this reference.
    image: "${VALIDATOR_IMAGE:-ghcr.io/backend-developers-ltd/factory-horde-validator-prototype@sha256:71807ba7181bf544388d2b809d69777adefc5cda89124e2d918c4b5834112eb5}"
    platform: linux/amd64
    restart: unless-stopped
    user: "${CONTAINER_UID:?}:${CONTAINER_GID:?}"
    environment:
      NETUID: "${NETUID:?}"
      MECHANISM_ID: "${MECHANISM_ID:-0}"
      VALIDATOR_PYLON_SERVICE_ADDRESS: http://pylon:8000
      VALIDATOR_PYLON_OPEN_ACCESS_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      VALIDATOR_PYLON_IDENTITY_NAME: validator
      VALIDATOR_PYLON_IDENTITY_TOKEN: "${VALIDATOR_PYLON_IDENTITY_TOKEN:?}"
      VALIDATOR_DATA_ROOT: "${VALIDATOR_DATA_ROOT:-/var/lib/factory-horde}"
      VALIDATOR_DISPATCH_ENABLED: "${VALIDATOR_DISPATCH_ENABLED:-false}"
      VALIDATOR_HOTKEY: "${VALIDATOR_HOTKEY:-}"
      VALIDATOR_JUDGE_IMAGE: "${JUDGE_IMAGE:-}"
      VALIDATOR_GENERATION_WINDOW: "${GENERATION_SECONDS:-3600}"
      VALIDATOR_CONFIRMATION_WINDOW: "${CONFIRMATION_SECONDS:-300}"
      VALIDATOR_EVALUATION_WINDOW: "${EVALUATION_SECONDS:-3300}"
      VALIDATOR_JUDGE_STOP_RESERVE: "${JUDGE_STOP_RESERVE_SECONDS:-300}"
      VALIDATOR_STOP_GRACE_SECONDS: "${STOP_GRACE_SECONDS:-60}"
      VALIDATOR_WEIGHTS_ENABLED: "${VALIDATOR_WEIGHTS_ENABLED:-false}"
      VALIDATOR_WEIGHT_TEMPERATURE: "${WEIGHT_TEMPERATURE:-0.1}"
      VALIDATOR_WEIGHT_TEMPO: "${SUBNET_TEMPO:-360}"
      VALIDATOR_WEIGHT_EPOCH_OFFSET: "${WEIGHT_EPOCH_OFFSET:-0}"
      VALIDATOR_METRICS_PORT: "9101"
      VALIDATOR_OBSERVATION_MAX_AGE_SECONDS: "${OBSERVATION_MAX_AGE_SECONDS:-30}"
      VALIDATOR_LOGGING_FORMAT: json
      VALIDATOR_OTEL_SDK_DISABLED: "true"
      VALIDATOR_OTEL_SERVICE_NAMESPACE: factory-horde
      ENVIRONMENT: "${ENVIRONMENT:?}"
      BITTENSOR_NETWORK: "${BITTENSOR_NETWORK:?}"
    volumes:
      - "${FACTORY_HORDE_DATA_ROOT:?}:${VALIDATOR_DATA_ROOT:-/var/lib/factory-horde}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/readyz', timeout=4).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      pylon:
        condition: service_healthy

  node-exporter:
    # node-exporter:v1.12.1
    image: docker.io/prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|boot|var/.+)($$|/)

  prometheus:
    # prometheus:v3.15.1
    image: docker.io/prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    environment:
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
    volumes:
      - prometheus-data:/prometheus
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: host
            static_configs:
              - targets: ['node-exporter:9100']
          - job_name: pylon
            static_configs:
              - targets: ['pylon:8000']
            authorization:
              type: Bearer
              credentials: "$${PYLON_METRICS_TOKEN}"
          - job_name: validator
            static_configs:
              - targets: ['validator:9101']
        EOF
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.size=1GB
    depends_on: [pylon, node-exporter]

volumes:
  pylon-data:
  prometheus-data:

# Tracing and external remote-write are deliberately disabled. No upstream credentials are required.
