# Common application services. Localnet overlays only the chain, identities and isolated paths.
services:
  pylon:
    # bittensor-pylon:2.5.0
    image: docker.io/backenddevelopersltd/bittensor-pylon@sha256:5c1996a329ce4361a52dcae2fd04903cc2a9b86547f915e8ce284715c1bb6488
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PYLON_HOST_PORT:-8000}:8000"
    environment:
      PYLON_BITTENSOR_NETWORK: "${BITTENSOR_NETWORK:?}"
      PYLON_BITTENSOR_ARCHIVE_NETWORK: "${BITTENSOR_ARCHIVE_NETWORK:-${BITTENSOR_NETWORK:?}}"
      PYLON_OPEN_ACCESS_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      PYLON_IDENTITIES: '["validator"]'
      PYLON_BITTENSOR_WALLET_PATH: /wallets
      PYLON_DATABASE_PATH: /data/pylon.db
      PYLON_ID_VALIDATOR_WALLET_NAME: "${BITTENSOR_WALLET_NAME:-validator}"
      PYLON_ID_VALIDATOR_HOTKEY_NAME: "${BITTENSOR_WALLET_HOTKEY_NAME:-default}"
      PYLON_ID_VALIDATOR_NETUID: "${NETUID:?}"
      PYLON_ID_VALIDATOR_TOKEN: "${VALIDATOR_PYLON_IDENTITY_TOKEN:?}"
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
      PYLON_BLOCK_DURATION_SECONDS: "${BLOCK_DURATION_SECONDS:-12}"
      PYLON_ENVIRONMENT: "${ENVIRONMENT:?}"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - "${HOST_WALLET_DIR:?}:/wallets:ro"
      - pylon-data:/data
    healthcheck:
      test:
        - CMD
        - /app/pylon_service/.venv/bin/python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  validator:
    # The environment's published release, bumped via knowledge/validator.deploy.md (Procedure 2).
    image: "ghcr.io/backend-developers-ltd/factory-horde-validator-${ENVIRONMENT:?}@sha256:51d9c45a5b191e967a89d167ceaf176a34e44739792ae10fdcb7b39180bcdf21"
    platform: linux/amd64
    restart: unless-stopped
    user: "${CONTAINER_UID:?}:${CONTAINER_GID:?}"
    environment:
      NETUID: "${NETUID:?}"
      MECHANISM_ID: "${MECHANISM_ID:-0}"
      VALIDATOR_PYLON_SERVICE_ADDRESS: http://pylon:8000
      VALIDATOR_PYLON_OPEN_ACCESS_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      VALIDATOR_PYLON_IDENTITY_NAME: validator
      VALIDATOR_PYLON_IDENTITY_TOKEN: "${VALIDATOR_PYLON_IDENTITY_TOKEN:?}"
      VALIDATOR_DATA_ROOT: "${VALIDATOR_DATA_ROOT:-/var/lib/factory-horde}"
      VALIDATOR_DISPATCH_ENABLED: "${VALIDATOR_DISPATCH_ENABLED:-false}"
      VALIDATOR_HOTKEY: "${VALIDATOR_HOTKEY:-}"
      VALIDATOR_JUDGE_IMAGE: "${JUDGE_IMAGE:-}"
      # Optional and transitional: reads envelopes committed before they carried ghcr.io/OWNER.
      VALIDATOR_SUBMISSION_NAMESPACE: "${SUBMISSION_NAMESPACE:-}"
      VALIDATOR_GENERATION_WINDOW: "${GENERATION_SECONDS:-3600}"
      VALIDATOR_CONFIRMATION_WINDOW: "${CONFIRMATION_SECONDS:-300}"
      VALIDATOR_EVALUATION_WINDOW: "${EVALUATION_SECONDS:-3300}"
      VALIDATOR_JUDGE_STOP_RESERVE: "${JUDGE_STOP_RESERVE_SECONDS:-300}"
      VALIDATOR_STOP_GRACE_SECONDS: "${STOP_GRACE_SECONDS:-60}"
      # Empty keeps the validator's built-in specification.
      VALIDATOR_SPECIFICATION: "${TASK_SPECIFICATION:-}"
      VALIDATOR_TASK_DIRECTORY: "${TASK_DIRECTORY:+/tasks}"
      VALIDATOR_REQUIREMENTS: "${TASK_REQUIREMENTS:-[]}"
      VALIDATOR_JUDGE_MODE: "${JUDGE_MODE:-review}"
      VALIDATOR_JUDGE_MODEL: "${JUDGE_MODEL:-}"
      VALIDATOR_WEIGHTS_ENABLED: "${VALIDATOR_WEIGHTS_ENABLED:-false}"
      VALIDATOR_WEIGHT_TEMPO: "${SUBNET_TEMPO:-360}"
      VALIDATOR_WEIGHT_EPOCH_OFFSET: "${WEIGHT_EPOCH_OFFSET:-0}"
      VALIDATOR_METRICS_PORT: "9101"
      VALIDATOR_OBSERVATION_MAX_AGE_SECONDS: "${OBSERVATION_MAX_AGE_SECONDS:-30}"
      VALIDATOR_LOGGING_FORMAT: json
      VALIDATOR_OTEL_SDK_DISABLED: "true"
      VALIDATOR_OTEL_SERVICE_NAMESPACE: factory-horde
      ENVIRONMENT: "${ENVIRONMENT:?}"
      BITTENSOR_NETWORK: "${BITTENSOR_NETWORK:?}"
    volumes:
      - "${FACTORY_HORDE_DATA_ROOT:?}:${VALIDATOR_DATA_ROOT:-/var/lib/factory-horde}"
      - "${TASK_DIRECTORY:-../../tasks}:/tasks:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/readyz', timeout=4).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      pylon:
        condition: service_healthy

  # Host network namespace so network metrics describe the host's interfaces, not a container's.
  # It listens only on the default bridge address that host.docker.internal (host-gateway) resolves
  # to, never on public interfaces.
  node-exporter:
    # node-exporter:v1.13.1
    image: docker.io/prom/node-exporter@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      NODE_EXPORTER_PORT: "${NODE_EXPORTER_HOST_PORT:-9100}"
    volumes:
      - /:/host:ro,rslave
    entrypoint:
      - /bin/sh
      - -ec
      - |
        address=$$(ip -4 -o addr show docker0 | awk '{split($$4, a, "/"); print a[1]; exit}')
        [ -n "$$address" ] || { echo "docker0 has no IPv4 address" >&2; exit 1; }
        exec /bin/node_exporter --path.rootfs=/host \
          --collector.filesystem.mount-points-exclude='^/(sys|proc|dev|host|etc|run|boot|var/.+)($$|/)' \
          --web.listen-address="$$address:$$NODE_EXPORTER_PORT"

  prometheus:
    # prometheus:v3.15.1
    image: docker.io/prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    environment:
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
      NODE_EXPORTER_PORT: "${NODE_EXPORTER_HOST_PORT:-9100}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - prometheus-data:/prometheus
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/prometheus.yml <<EOF
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: host
            static_configs:
              - targets: ['host.docker.internal:$${NODE_EXPORTER_PORT}']
          - job_name: pylon
            static_configs:
              - targets: ['pylon:8000']
            authorization:
              type: Bearer
              credentials: "$${PYLON_METRICS_TOKEN}"
          - job_name: validator
            static_configs:
              - targets: ['validator:9101']
          - job_name: claude-usage
            static_configs:
              - targets: ['claude-usage-exporter:9102']
        EOF
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.size=1GB
    depends_on: [pylon, node-exporter, claude-usage-exporter]

  # Optional push to the company monitoring stack, started only with COMPOSE_PROFILES=alloy in .env;
  # that profile also needs METRICS_UPSTREAM_USER and METRICS_UPSTREAM_PASSWORD.
  alloy:
    # alloy:v1.21.1
    image: docker.io/grafana/alloy@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8
    platform: linux/amd64
    profiles: [alloy]
    restart: unless-stopped
    environment:
      METRICS_UPSTREAM_URL: "${METRICS_UPSTREAM_URL:-https://alloy.reef.pl}"
      METRICS_UPSTREAM_USER: "${METRICS_UPSTREAM_USER:-}"
      METRICS_UPSTREAM_PASSWORD: "${METRICS_UPSTREAM_PASSWORD:-}"
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
      NODE_EXPORTER_PORT: "${NODE_EXPORTER_HOST_PORT:-9100}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./alloy:/etc/alloy:ro
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    depends_on: [pylon, node-exporter, claude-usage-exporter]

  # Optional inference proxy, started only with COMPOSE_PROFILES=inference in .env. It holds the Claude
  # credential and is the only service factories and judges can reach on the internal network that the
  # executor discovers it on (EXECUTOR_FACTORY_NETWORK). Each workload gets a separate isolated network
  # connected only to this proxy. The proxy applies no per-workload quota.
  inference-proxy:
    # caddy:2.11.9
    image: docker.io/library/caddy@sha256:e40b94d0a43b5ff69cb20568d73f10c70703df7b0ffc2298eb3d723cdc9d0bd1
    platform: linux/amd64
    profiles: [inference]
    restart: unless-stopped
    environment:
      # Compose interpolates inactive profiles too, so the entrypoint requires the token instead.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
    networks: [default, inference]
    read_only: true
    volumes:
      - inference-log:/var/log/inference
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${CLAUDE_CODE_OAUTH_TOKEN:?}"
        cat > /tmp/Caddyfile <<'EOF'
        {
          auto_https off
          admin off
        }
        :8080 {
          # Read by claude-usage-exporter for the subscription budget headers. Caddy redacts
          # Authorization, and the request only carries the workload's placeholder token anyway.
          log {
            output file /var/log/inference/access.json {
              roll_size 10MiB
              roll_keep 1
            }
            format json
          }
          handle /healthz {
            log_skip
            respond 200
          }
          handle /v1/messages* {
            reverse_proxy https://api.anthropic.com {
              header_up Authorization "Bearer {env.CLAUDE_CODE_OAUTH_TOKEN}"
              header_up -x-api-key
              flush_interval -1
            }
          }
          handle {
            respond 404
          }
        }
        EOF
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Claude subscription budget for the dashboard, read from the rate-limit headers that Anthropic
  # returns on the inference proxy's responses. Values only change while workloads call Claude, and
  # none are exported without the inference profile. Separate from the validator so it can be
  # removed with the subscription: delete this service, the proxy's log block and volume, and the
  # claude-usage scrape jobs.
  claude-usage-exporter:
    # python:3.13-alpine
    image: docker.io/library/python@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    volumes:
      - inference-log:/var/log/inference:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        LOG = "/var/log/inference/access.json"
        HEADER = "Anthropic-Ratelimit-Unified-{}-{}"
        WINDOWS = ("5h", "7d")
        # Per window: (observed timestamp, utilization, reset). Anthropic omits windows from some
        # responses, so each keeps the newest response that reported it.
        latest = {}
        # Windows present in the newest response that carried any budget headers. A window missing
        # there is one the subscription does not report, as opposed to no data at all.
        newest = {"ts": 0.0, "windows": set()}


        def refresh():
            """Update each window from the newest logged responses that reported it."""
            try:
                with open(LOG, "rb") as log:
                    log.seek(0, 2)
                    log.seek(max(0, log.tell() - 1048576))
                    lines = log.read().splitlines()
            except FileNotFoundError:
                return
            for line in lines:
                try:
                    entry = json.loads(line)
                    ts = float(entry["ts"])
                    headers = entry["resp_headers"]
                except (ValueError, KeyError, TypeError):
                    continue
                if isinstance(headers, dict) and "Anthropic-Ratelimit-Unified-Status" in headers and ts > newest["ts"]:
                    newest.update(ts=ts, windows={w for w in WINDOWS if HEADER.format(w, "Utilization") in headers})
                for window in WINDOWS:
                    try:
                        utilization = float(headers[HEADER.format(window, "Utilization")][0])
                        reset = float(headers[HEADER.format(window, "Reset")][0])
                    except (ValueError, KeyError, TypeError, IndexError):
                        continue
                    if ts > latest.get(window, (0.0,))[0]:
                        latest[window] = (ts, utilization, reset)


        def family(name, help_text, index):
            return [
                "# HELP %s %s" % (name, help_text),
                "# TYPE %s gauge" % name,
                *('%s{window="%s"} %s' % (name, window, values[index]) for window, values in sorted(latest.items())),
            ]


        def metrics():
            refresh()
            if not newest["ts"]:
                return ""
            lines = [
                "# HELP claude_subscription_window_reported Whether the newest budget response reported the window.",
                "# TYPE claude_subscription_window_reported gauge",
                *('claude_subscription_window_reported{window="%s"} %d' % (w, w in newest["windows"]) for w in WINDOWS),
            ]
            lines += family(
                "claude_subscription_utilization_ratio", "Share of the subscription budget used in the window.", 1
            )
            lines += family("claude_subscription_reset_timestamp_seconds", "When the window's budget resets.", 2)
            lines += family(
                "claude_subscription_observed_timestamp_seconds", "When Anthropic last reported the window.", 0
            )
            return "\n".join(lines) + "\n"


        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path != "/metrics":
                    self.send_error(404)
                    return
                body = metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *args):
                pass


        ThreadingHTTPServer(("", 9102), Handler).serve_forever()

  registry-proxy:
    # Forward proxy for judge dependency installation; tunnels only to approved package registries.
    # ubuntu/squid:6.10-24.10_beta
    image: docker.io/ubuntu/squid@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
    platform: linux/amd64
    profiles: [inference]
    restart: unless-stopped
    networks: [default, registry]
    read_only: true
    user: proxy
    tmpfs:
      - /tmp
      - /var/spool/squid
      - /var/log/squid
      - /run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/squid.conf <<'EOF'
        http_port 3128
        max_filedescriptors 4096
        pinger_enable off
        acl registries dstdomain pypi.org files.pythonhosted.org registry.npmjs.org
        acl SSL_ports port 443
        acl CONNECT method CONNECT
        http_access deny !SSL_ports
        http_access allow CONNECT registries
        http_access deny all
        cache deny all
        access_log stdio:/proc/self/fd/1
        cache_log stdio:/proc/self/fd/2
        pid_filename none
        EOF
        exec squid -N -f /tmp/squid.conf

networks:
  registry:
    name: "${EXECUTOR_REGISTRY_NETWORK:-factory-horde-registry}"
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  inference:
    name: "${EXECUTOR_FACTORY_NETWORK:-factory-horde-inference}"
    internal: true
    # Without a host address on the bridge, factories cannot reach services bound on the host
    # either. Requires Docker Engine 28 or newer.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  pylon-data:
  prometheus-data:
  inference-log:

# Tracing is deliberately disabled. Only the opt-in alloy profile needs upstream credentials.
