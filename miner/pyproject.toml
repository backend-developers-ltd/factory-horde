[project]
name = "miner"
version = "0.1.0"
description = "One-shot FactoryHorde GHCR image submission through Pylon."
requires-python = ">=3.14"
dependencies = [
    "bittensor-pylon-client==2.3.0",
    "click>=8.3.2",
    "prometheus-client>=0.25.0",
    "tenacity>=9.1.4",
]

[project.scripts]
miner = "miner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["miner.py"]

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
bootstrap = [
    "bittensor==10.3.0",
    "bittensor-wallet==4.0.1",
    "python-dotenv==1.2.2",
]
dev = [
    "basedpyright>=1.36.1",
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TC005"]
preview = true
explicit-preview-rules = true
extend-select = ["DOC501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I", "F401"]

[tool.pytest.ini_options]
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["miner.py", "tests"]
verboseOutput = true
useLibraryCodeForTypes = true
reportMissingTypeStubs = "warning"
reportUndefinedVariable = "error"
reportUnusedImport = "warning"
reportExplicitAny = "none"
venvPath = "."
venv = ".venv"
extraPaths = [".venv/lib/python3.14/site-packages"]
