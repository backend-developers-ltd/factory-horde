# A miner's Pylon with a single "miner" identity, and the one-shot submitter that publishes
# FACTORY_IMAGE as its FactoryHorde envelope through it. Settings come from the .env beside this
# file; see README.md.
name: factory-horde-miner
services:
  pylon:
    # bittensor-pylon:2.4.0, same digest as envs/deployed/docker-compose.yml
    image: docker.io/backenddevelopersltd/bittensor-pylon@sha256:b0b4f4d532aed7dba6ffc979ce270ac3286b3c98678a87f8d2c3ec8086453184
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PYLON_HOST_PORT:-8000}:8000"
    environment:
      PYLON_BITTENSOR_NETWORK: "${BITTENSOR_NETWORK:?}"
      PYLON_BITTENSOR_ARCHIVE_NETWORK: "${BITTENSOR_ARCHIVE_NETWORK:-${BITTENSOR_NETWORK:?}}"
      PYLON_OPEN_ACCESS_TOKEN: "${PYLON_OPEN_ACCESS_TOKEN:?}"
      PYLON_IDENTITIES: '["miner"]'
      PYLON_BITTENSOR_WALLET_PATH: /wallets
      PYLON_DATABASE_PATH: /data/pylon.db
      PYLON_ID_MINER_WALLET_NAME: "${BITTENSOR_WALLET_NAME:?}"
      PYLON_ID_MINER_HOTKEY_NAME: "${BITTENSOR_WALLET_HOTKEY_NAME:-default}"
      PYLON_ID_MINER_NETUID: "${NETUID:?}"
      PYLON_ID_MINER_TOKEN: "${MINER_PYLON_TOKEN:?}"
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
      PYLON_BLOCK_DURATION_SECONDS: "${BLOCK_DURATION_SECONDS:-12}"
      PYLON_ENVIRONMENT: "${ENVIRONMENT:?}"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - "${HOST_WALLET_DIR:?}:/wallets:ro"
      - pylon-data:/data
    healthcheck:
      test:
        - CMD
        - /app/pylon_service/.venv/bin/python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Not started by "up". Run: docker compose run --rm submit [IMAGE]
  submit:
    # The environment's published submitter release, bumped via knowledge/validator.deploy.md (Procedure 2).
    image: "ghcr.io/backend-developers-ltd/factory-horde-submitter-${ENVIRONMENT:?}@sha256:f02d9efd4c278d3ddcc8b360893db0cc5e67572f061ab7801b64b8baca855f89"
    platform: linux/amd64
    profiles: [submit]
    environment:
      PYLON_ADDRESS: http://pylon:8000
      PYLON_IDENTITY: miner
      PYLON_IDENTITY_TOKEN: "${MINER_PYLON_TOKEN:?}"
      NETUID: "${NETUID:?}"
      SUBMISSION_NAMESPACE: "${SUBMISSION_NAMESPACE:?}"
    command: ["${FACTORY_IMAGE:-}"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      pylon:
        condition: service_healthy

volumes:
  pylon-data:
