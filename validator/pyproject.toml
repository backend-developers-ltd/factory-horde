[project]
name = "validator"
version = "0.1.0"
description = "Nexus-based Bittensor subnet validator."
requires-python = ">=3.14"
dependencies = [
    "attrs>=26.1.0", # previously this was required for Nexus (litestar needed it) #TODO: See if this is still the case
    "bittensor-nexus-library",
    "bittensor-pylon-client==2.4.0",
    "click>=8.3.2",
    "opentelemetry-api~=1.41",
    "opentelemetry-exporter-otlp-proto-http~=1.41",
    "opentelemetry-instrumentation-httpx~=0.63b1",
    "opentelemetry-sdk~=1.41",
    "opentelemetry-semantic-conventions~=0.63b1",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "sentry-sdk>=2.60.0",
    "structlog>=25,<27",
]

[project.scripts]
validator = "validator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.6"
constraint-dependencies = ["certifi>=2026.10.19", "botocore>=1.43.117"]
# This exclusion is a crucial security measure and MUST NOT be relaxed.
# This is intended to help avoid pulling in freshly published compromised dependencies.
exclude-newer = "11 days"
exclude-newer-package = { certifi = "P1D", botocore = "P1D", boto3 = "P1D", bittensor-pylon-client = false } # We control Pylon releases.
# Nexus d54e268 pins bittensor-pylon-client==2.3.1; 2.4.0 is additive (mechanism-aware neuron reads).
override-dependencies = ["bittensor-pylon-client==2.4.0"]

[tool.uv.sources]
# master: mechanism-aware status/writes and idle-context expiry (context_ttl).
bittensor-nexus-library = { git = "https://github.com/bittensor-church/bittensor-nexus-library.git", rev = "d54e268af8529f3329ae67562e926c74cd685b71" }

[dependency-groups]
dev = [
    "basedpyright>=1.36.1",
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TC005"]
preview = true
explicit-preview-rules = true
extend-select = ["DOC501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I", "F401"]

[tool.pytest.ini_options]
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
verboseOutput = true
useLibraryCodeForTypes = true
reportMissingTypeStubs = "warning"
reportUndefinedVariable = "error"
reportUnusedImport = "warning"
reportExplicitAny = "none"
venvPath = "."
venv = ".venv"
extraPaths = ["src", ".venv/lib/python3.14/site-packages", ".."]
