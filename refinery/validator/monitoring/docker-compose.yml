# Grafana for the Refinery validator, published over HTTPS by Caddy on ports 80 and 443. Started by
# refinery/validator/setup-monitoring.sh with /root/factory-horde-monitoring/.env. Grafana joins the
# validator application's Compose network to query its Prometheus.
services:
  grafana:
    # grafana:13.3.1
    image: docker.io/grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    platform: linux/amd64
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://${GRAFANA_ADDRESS:?}/"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?}"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/factory-horde-validator.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [default, validator]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  caddy:
    # caddy:2.11.9
    image: docker.io/library/caddy@sha256:e40b94d0a43b5ff69cb20568d73f10c70703df7b0ffc2298eb3d723cdc9d0bd1
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GRAFANA_ADDRESS: "${GRAFANA_ADDRESS:?}"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      grafana:
        condition: service_healthy

networks:
  validator:
    external: true
    name: factory-horde-refinery_default

volumes:
  grafana-data:
  caddy-data:
  caddy-config:
